<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Lagu - Ultimate Indonesian Music Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030307;
            --bg-surface: #0e0e16;
            --bg-elevated: #161622;
            --accent-glow: rgba(124, 58, 237, 0.25);
            --accent-primary: #8b5cf6;
            --accent-secondary: #ec4899;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            --success: #10b981;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 28px 16px;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(236, 72, 153, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s ease;
            padding: 20px;
            text-align: center;
        }

        .loader-spinner {
            width: 64px; height: 64px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #loading-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
            max-width: 540px;
        }

        .header h1 {
            font-size: 2.6rem;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            text-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
        }

        .header p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 400;
        }

        /* Stats & Score Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 14px 22px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .stats-bar span { color: var(--accent-secondary); }

        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Kategori Scroller */
        .category-scroller {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }
        .category-scroller::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--bg-surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cat-btn:hover {
            border-color: rgba(255, 255, 255, 0.25);
            color: var(--text-main);
            background: var(--bg-elevated);
        }

        .cat-btn.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        /* Timeline Durasi (5 Slot Waktu) */
        .timeline-container {
            display: flex;
            height: 12px;
            background: var(--bg-surface);
            border-radius: 8px;
            overflow: hidden;
            gap: 4px;
            padding: 3px;
            border: 1px solid var(--border);
        }

        .timeline-segment {
            background: var(--bg-elevated);
            height: 100%;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        .timeline-segment.active { background: var(--accent-primary); box-shadow: 0 0 10px var(--accent-primary); }

        /* Slot Percobaan (5 Baris) */
        .attempts-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .attempt-slot {
            height: 48px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.2s;
        }
        .attempt-slot.wrong { border-color: var(--danger); color: var(--danger); background: rgba(244, 63, 94, 0.06); }
        .attempt-slot.skipped { border-color: rgba(255,255,255,0.15); color: var(--text-muted); }
        .attempt-slot.correct { border-color: var(--success); color: var(--success); font-weight: 700; background: rgba(16, 185, 129, 0.08); }

        /* Play Card Utama */
        .play-section {
            text-align: center;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 28px;
            position: relative;
            box-shadow: 0 12px 35px rgba(0,0,0,0.4);
        }

        .btn-play-pulse {
            width: 78px; height: 78px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s;
        }

        .btn-play-pulse:hover {
            transform: scale(1.08);
            box-shadow: 0 14px 35px rgba(139, 92, 246, 0.7);
        }

        .btn-play-pulse:active { transform: scale(0.95); }

        .btn-play-pulse svg {
            width: 32px; height: 32px; fill: #fff; margin-left: 3px;
        }

        .duration-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 14px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        /* Search Autocomplete */
        .search-box { position: relative; }
        
        .search-results {
            position: absolute;
            bottom: calc(100% + 8px); left: 0; right: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            max-height: 230px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            display: none;
        }

        .search-item {
            padding: 13px 18px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
            transition: background 0.15s;
        }
        .search-item:hover { background: rgba(255,255,255,0.06); color: var(--accent-secondary); }

        .guess-input-field {
            width: 100%;
            padding: 15px 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            color: var(--text-main);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .guess-input-field:focus { 
            border-color: var(--accent-primary); 
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2), inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Action Buttons */
        .action-row { display: flex; gap: 12px; }
        
        .btn {
            padding: 15px; border-radius: var(--radius-lg); border: none; font-weight: 700;
            cursor: pointer; font-size: 0.92rem; flex: 1;
            transition: filter 0.2s, transform 0.1s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-skip { background: var(--bg-elevated); color: var(--text-main); border: 1px solid var(--border); }
        .btn-skip:hover { background: var(--bg-surface); border-color: rgba(255,255,255,0.2); }
        .btn-submit { background: var(--accent-gradient); color: #fff; box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4); }
        .btn-submit:hover { box-shadow: 0 10px 30px rgba(139, 92, 246, 0.6); }

        /* Result Card */
        .result-card {
            text-align: center;
            background: var(--bg-surface);
            padding: 40px 28px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        .result-card img {
            width: 170px; height: 170px;
            border-radius: var(--radius-lg); margin: 15px 0 22px 0;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            object-fit: cover;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <p id="loading-text">Menyinkronkan ribuan lagu hits lintas generasi Indonesia...</p>
    </div>

    <div class="header">
        <h1>GUESS LAGU</h1>
        <p>Tebak intro lagu legendaris, band, soloist, & group dari semua era!</p>
    </div>

    <div class="container">
        <!-- Game Area -->
        <div id="game-area" class="hidden">
            
            <div class="stats-bar">
                <div>Skor: <span id="total-score">0</span></div>
                <div>Streak: <span id="streak-count">0 🔥</span></div>
            </div>

            <!-- Kategori / Era / Genre Komprehensif -->
            <div class="category-scroller">
                <button class="cat-btn active" data-cat="all">Semua Era & Genre</button>
                <button class="cat-btn" data-cat="legend">Legend 70-80an</button>
                <button class="cat-btn" data-cat="band">Band Legendaris</button>
                <button class="cat-btn" data-cat="boygirl">Boy/Girlband</button>
                <button class="cat-btn" data-cat="90s">Era 90-an</button>
                <button class="cat-btn" data-cat="2000s">Era 2000-an</button>
                <button class="cat-btn" data-cat="2010s">Era 2010-an</button>
                <button class="cat-btn" data-cat="2020s">Era 2020-an</button>
                <button class="cat-btn" data-cat="solo">Soloist Hits</button>
            </div>

            <!-- Timeline (5 Langkah: 0.5s, 1s, 3s, 5s, 8s) -->
            <div class="timeline-container" id="timeline"></div>

            <!-- Slot Tebakan (5 Baris) -->
            <div class="attempts-list" id="attempts-list">
                <div class="attempt-slot">1.</div>
                <div class="attempt-slot">2.</div>
                <div class="attempt-slot">3.</div>
                <div class="attempt-slot">4.</div>
                <div class="attempt-slot">5.</div>
            </div>

            <!-- Tombol Play Audio Intro -->
            <div class="play-section">
                <button class="btn-play-pulse" id="btn-play" title="Putar Intro Lagu">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="duration-label" id="duration-info">Dengarkan Intro: 0.5 Detik</div>
            </div>

            <!-- Input Prediksi -->
            <div class="search-box">
                <div class="search-results" id="search-results"></div>
                <input type="text" id="guess-input" class="guess-input-field" placeholder="Ketik judul lagu atau nama penyanyi...">
            </div>

            <!-- Action Buttons -->
            <div class="action-row">
                <button class="btn btn-skip" id="btn-skip">Lewati (+1s)</button>
                <button class="btn btn-submit" id="btn-submit">Tebak</button>
            </div>
        </div>

        <!-- Result Card -->
        <div id="result-card" class="result-card hidden">
            <h2 id="result-title" style="margin-bottom: 5px; font-size: 1.6rem;"></h2>
            <p id="points-earned" style="color: var(--success); font-weight: 700; font-size: 0.98rem; margin-bottom: 12px;"></p>
            <img id="album-cover" src="" alt="Album Artwork">
            <h3 id="song-title-res" style="font-size: 1.3rem; font-weight: 700;"></h3>
            <p id="artist-res" style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 24px;"></p>
            
            <button class="btn btn-submit" id="btn-next" style="width: 100%;">Lagu Selanjutnya ➔</button>
        </div>
    </div>

    <!-- Audio Player -->
    <audio id="audio-player"></audio>

    <script>
        const STEPS = [0.5, 1.0, 3.0, 5.0, 8.0];
        
        let trackPool = [];
        let currentTrack = null;
        let currentStep = 0;
        let currentCategory = "all";
        let score = 0;
        let streak = 0;
        let isGameOver = false;
        let audioTimeout = null;

        // Bank database keyword super lengkap dari semua era & genre musik Indonesia
        const categoryKeywords = {
            'all': ['dewa 19', 'peterpan', 'sheila on 7', 'slank', 'iwan fals', 'chrisye', 'koes plus', 'tulus', 'raisa', 'mahalini', 'jkt48', 'smsh', 'ungu', 'padi', 'noah', 'gigi', 'rossa', 'afgan', 'judika', 'kangen band'],
            'legend': ['koes plus', 'panbers', 'iwan fals', 'chrisye', 'ebiet g ade', 'bimbo', 'titiek puspa', 'gombloh', 'vina panduwinata', 'broery marantika', 'rinto harahap', 'deddy dores'],
            'band': ['dewa 19', 'peterpan', 'sheila on 7', 'slank', 'ungu', 'kangen band', 'nidji', 'dmasiv', 'noah', 'geisha', 'gigi', 'padi', 'kahitna', 'radja', 'st12', 'armada', 'kotak', 'fourtwnty', 'barasuara', 'element', 'netral', 'wali', 'the changcuters'],
            'boygirl': ['sm*sh', 'jkt48', 'cherrybelle', 'coboy junior', 'cjr', '7icons', 'blink', 's/m/s/h', 'super seven', 'un1ty', 'vierra', 'project pop', 'tulus'],
            '90s': ['dewa 19', 'chrisye', 'slank', 'krisdayanti', 'kahitna', 'naif', 'jamrud', 'element', 'iwa k', 'oppie andaresta', 'pas band', 'edane', 'slank', 'tohpati', 'rangga'],
            '2000s': ['peterpan', 'sheila on 7', 'ungu', 'radja', 'kangen band', 'nidji', 'dmasiv', 'st12', 'ada band', 'samsons', 'geisha', 'cokelat', 'gigi', 'project pop', 'anang krisdayanti', 'melly goeslaw'],
            '2010s': ['tulus', 'raisa', 'afgan', 'noah', 'isyana sarasvati', 'rizky febian', 'yura yunita', 'judika', 'payung teduh', 'bcl', 'virgoun', 'armada', 'jaz', 'barasuara', 'geisha'],
            '2020s': ['mahalini', 'tiara andini', 'ziva magnolya', 'fabio asher', 'keisya levronka', 'lyodra', 'brisia jodie', 'nadin amizah', 'hindia', 'pamungkas', 'fiersa besari', 'sal priadi', 'maliq essentials', 'idgitaf', 'rizky febian'],
            'solo': ['chrisye', 'iwan fals', 'ebiet g ade', 'glenn fredly', 'rossa', 'tulus', 'raisa', 'afgan', 'judika', 'isyana sarasvati', 'rizky febian', 'yura yunita', 'mahalini', 'tiara andini', 'pamungkas', 'virgoun', 'bcl', 'melly goeslaw']
        };

        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');
        const gameArea = document.getElementById('game-area');
        const resultCard = document.getElementById('result-card');
        const timeline = document.getElementById('timeline');
        const attemptsList = document.getElementById('attempts-list');
        const btnPlay = document.getElementById('btn-play');
        const durationInfo = document.getElementById('duration-info');
        const guessInput = document.getElementById('guess-input');
        const searchResults = document.getElementById('search-results');
        const btnSkip = document.getElementById('btn-skip');
        const btnSubmit = document.getElementById('btn-submit');
        const btnNext = document.getElementById('btn-next');
        const audioPlayer = document.getElementById('audio-player');
        const catBtns = document.querySelectorAll('.cat-btn');
        const totalScoreEl = document.getElementById('total-score');
        const streakCountEl = document.getElementById('streak-count');

        function renderTimeline() {
            timeline.innerHTML = '';
            const total = STEPS[STEPS.length - 1];
            STEPS.forEach((step, idx) => {
                const seg = document.createElement('div');
                seg.className = 'timeline-segment' + (idx <= currentStep ? ' active' : '');
                const prev = idx === 0 ? 0 : STEPS[idx - 1];
                seg.style.width = `${((step - prev) / total) * 100}%`;
                timeline.appendChild(seg);
            });
        }

        async function fetchTracks(category) {
            loadingScreen.style.opacity = '1';
            loadingScreen.classList.remove('hidden');
            gameArea.classList.add('hidden');
            resultCard.classList.add('hidden');
            
            trackPool = [];
            const keywords = categoryKeywords[category] || categoryKeywords['all'];
            
            // Ambil acak 8 keyword sekaligus untuk memastikan ratusan hingga ribuan lagu terkumpul instan
            const shuffled = [...keywords].sort(() => 0.5 - Math.random()).slice(0, 8);

            try {
                loadingText.textContent = `Memuat database musik ${category.toUpperCase()} dari seluruh era...`;
                
                const fetchPromises = shuffled.map(kw => 
                    fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(kw)}&country=id&entity=song&limit=50`)
                    .then(res => res.json())
                );

                const results = await Promise.all(fetchPromises);
                
                results.forEach(data => {
                    if (data.results) {
                        const validTracks = data.results.filter(t => t.previewUrl);
                        trackPool = trackPool.concat(validTracks);
                    }
                });

                // Hapus duplikat ID lagu
                trackPool = trackPool.filter((track, index, self) =>
                    index === self.findIndex((t) => (t.trackId === track.trackId))
                );

                if (trackPool.length === 0) throw new Error("Kosong");

                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    startNewRound();
                }, 400);

            } catch (err) {
                loadingText.textContent = "Menghubungkan ulang ke server database lagu...";
                setTimeout(() => fetchTracks('all'), 1000);
            }
        }

        catBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                catBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
                fetchTracks(currentCategory);
            });
        });

        function startNewRound() {
            isGameOver = false;
            currentStep = 0;
            resultCard.classList.add('hidden');
            gameArea.classList.remove('hidden');

            currentTrack = trackPool[Math.floor(Math.random() * trackPool.length)];
            audioPlayer.src = currentTrack.previewUrl;

            const slots = attemptsList.querySelectorAll('.attempt-slot');
            slots.forEach((s, i) => {
                s.className = 'attempt-slot';
                s.textContent = `${i + 1}.`;
            });

            guessInput.value = '';
            guessInput.disabled = false;
            btnSkip.disabled = false;
            btnSubmit.disabled = false;

            updateStepUI();
        }

        function updateStepUI() {
            renderTimeline();
            const dur = STEPS[currentStep];
            durationInfo.textContent = `Dengarkan Intro: ${dur} Detik`;
            btnSkip.textContent = currentStep === 4 ? 'Menyerah' : `Lewati (+${STEPS[currentStep + 1] - dur}s)`;
        }

        btnPlay.addEventListener('click', () => {
            if (!audioPlayer.src) return;
            if (audioTimeout) clearTimeout(audioTimeout);

            audioPlayer.currentTime = 0; // Mulai dari intro lagu
            audioPlayer.play().catch(()=>{});

            audioTimeout = setTimeout(() => {
                audioPlayer.pause();
            }, STEPS[currentStep] * 1000);
        });

        guessInput.addEventListener('input', () => {
            const val = guessInput.value.toLowerCase().trim();
            if (!val) {
                searchResults.style.display = 'none';
                return;
            }

            const matches = trackPool.filter(t => 
                t.trackName.toLowerCase().includes(val) || 
                t.artistName.toLowerCase().includes(val)
            ).slice(0, 5);

            if (matches.length > 0) {
                searchResults.innerHTML = '';
                matches.forEach(t => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.textContent = `${t.trackName} - ${t.artistName}`;
                    div.addEventListener('click', () => {
                        guessInput.value = div.textContent;
                        searchResults.style.display = 'none';
                    });
                    searchResults.appendChild(div);
                });
                searchResults.style.display = 'block';
            } else {
                searchResults.style.display = 'none';
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) searchResults.style.display = 'none';
        });

        btnSubmit.addEventListener('click', () => processGuess(guessInput.value.trim()));
        btnSkip.addEventListener('click', () => processGuess('SKIPPED'));

        function processGuess(guessText) {
            if (isGameOver) return;
            if (guessText === '' && guessText !== 'SKIPPED') return;

            const slots = attemptsList.querySelectorAll('.attempt-slot');
            const currentSlot = slots[currentStep];
            const fullName = `${currentTrack.trackName} - ${currentTrack.artistName}`;

            if (guessText.toLowerCase() === fullName.toLowerCase() || 
               (guessText.length > 3 && currentTrack.trackName.toLowerCase().includes(guessText.toLowerCase()))) {
                
                currentSlot.classList.add('correct');
                currentSlot.textContent = `✓ ${fullName}`;
                endRound(true);
                return;
            }

            if (guessText === 'SKIPPED') {
                currentSlot.classList.add('skipped');
                currentSlot.textContent = `🚫 Dilewati`;
            } else {
                currentSlot.classList.add('wrong');
                currentSlot.textContent = `✗ ${guessText}`;
            }

            if (currentStep < 4) {
                currentStep++;
                updateStepUI();
                guessInput.value = '';
            } else {
                endRound(false);
            }
        }

        function endRound(isWin) {
            isGameOver = true;
            audioPlayer.pause();
            guessInput.disabled = true;
            btnSkip.disabled = true;
            btnSubmit.disabled = true;

            setTimeout(() => {
                gameArea.classList.add('hidden');
                resultCard.classList.remove('hidden');

                const titleEl = document.getElementById('result-title');
                const pointsEl = document.getElementById('points-earned');

                if (isWin) {
                    titleEl.textContent = "LUAR BIASA! BENAR! 🎉";
                    titleEl.style.color = "var(--success)";
                    
                    const earned = (5 - currentStep) * 10;
                    score += earned;
                    streak += 1;
                    pointsEl.textContent = `+${earned} Poin Berhasil Ditambahkan!`;
                } else {
                    titleEl.textContent = "JAWABAN SALAH, COBA LAGI! 😅";
                    titleEl.style.color = "var(--danger)";
                    streak = 0;
                    pointsEl.textContent = `Poin ditambah 0`;
                }

                totalScoreEl.textContent = score;
                streakCountEl.textContent = `${streak} 🔥`;

                const artworkUrl = currentTrack.artworkUrl100 ? currentTrack.artworkUrl100.replace('100x100bb', '400x400bb') : '';
                
                document.getElementById('album-cover').src = artworkUrl;
                document.getElementById('song-title-res').textContent = currentTrack.trackName;
                document.getElementById('artist-res').textContent = currentTrack.artistName;

                audioPlayer.currentTime = 0;
                audioPlayer.play().catch(() => {});
            }, 800);
        }

        btnNext.addEventListener('click', startNewRound);

        window.onload = () => {
            fetchTracks('all');
        };
    </script>
</body>
</html>
