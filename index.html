<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Lagu - Tebak Musik Indonesia Terbesar</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #07070a;
            --bg-surface: #121218;
            --bg-elevated: #1a1a24;
            --accent-primary: #6366f1;
            --accent-secondary: #ec4899;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            --success: #10b981;
            --danger: #f43f5e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 40%);
        }

        /* Loading Screen Ultra Modern */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-base);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s ease;
            padding: 20px;
            text-align: center;
        }

        .loader-spinner {
            width: 60px; height: 60px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #loading-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 520px;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Stats & Score Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: var(--radius-lg);
            margin-bottom: 16px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .stats-bar span { color: var(--accent-secondary); }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Kategori Scroller */
        .category-scroller {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .category-scroller::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--bg-surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 9px 16px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .cat-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
        }

        .cat-btn.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* Timeline Durasi (5 Slot Waktu) */
        .timeline-container {
            display: flex;
            height: 10px;
            background: var(--bg-surface);
            border-radius: 6px;
            overflow: hidden;
            gap: 3px;
            padding: 2px;
            border: 1px solid var(--border);
        }

        .timeline-segment {
            background: var(--bg-elevated);
            height: 100%;
            border-radius: 4px;
            transition: background 0.3s ease;
        }
        .timeline-segment.active { background: var(--accent-primary); }

        /* Slot Percobaan (5 Baris) */
        .attempts-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .attempt-slot {
            height: 44px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .attempt-slot.wrong { border-color: var(--danger); color: var(--danger); background: rgba(244, 63, 94, 0.05); }
        .attempt-slot.skipped { border-color: rgba(255,255,255,0.15); color: var(--text-muted); }
        .attempt-slot.correct { border-color: var(--success); color: var(--success); font-weight: 700; background: rgba(16, 185, 129, 0.06); }

        /* Play Card Utama */
        .play-section {
            text-align: center;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 24px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .btn-play-pulse {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-play-pulse:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.6);
        }

        .btn-play-pulse:active { transform: scale(0.96); }

        .btn-play-pulse svg {
            width: 30px; height: 30px; fill: #fff; margin-left: 3px;
        }

        .duration-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Search Autocomplete */
        .search-box { position: relative; }
        
        .search-results {
            position: absolute;
            bottom: calc(100% + 6px); left: 0; right: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
            display: none;
        }

        .search-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
            transition: background 0.15s;
        }
        .search-item:hover { background: rgba(255,255,255,0.06); color: var(--accent-secondary); }

        .guess-input-field {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .guess-input-field:focus { border-color: var(--accent-primary); }

        /* Action Buttons */
        .action-row { display: flex; gap: 10px; }
        
        .btn {
            padding: 14px; border-radius: var(--radius-lg); border: none; font-weight: 700;
            cursor: pointer; font-size: 0.9rem; flex: 1;
            transition: filter 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-skip { background: var(--bg-elevated); color: var(--text-main); border: 1px solid var(--border); }
        .btn-submit { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }

        /* Result Card */
        .result-card {
            text-align: center;
            background: var(--bg-surface);
            padding: 35px 25px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            box-shadow: 0 15px 45px rgba(0,0,0,0.6);
        }

        .result-card img {
            width: 160px; height: 160px;
            border-radius: var(--radius-lg); margin: 15px 0 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            object-fit: cover;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <p id="loading-text">Menyiapkan ribuan database hits legendaris Indonesia...</p>
    </div>

    <div class="header">
        <h1>GUESS LAGU</h1>
        <p>Tebak intro lagu legendaris, band, soloist, & boy/girlband!</p>
    </div>

    <div class="container">
        <!-- Game Area -->
        <div id="game-area" class="hidden">
            
            <div class="stats-bar">
                <div>Skor: <span id="total-score">0</span></div>
                <div>Streak: <span id="streak-count">0 🔥</span></div>
            </div>

            <!-- Kategori / Era / Genre -->
            <div class="category-scroller">
                <button class="cat-btn active" data-cat="all">Semua Hits</button>
                <button class="cat-btn" data-cat="band">Band Legendaris</button>
                <button class="cat-btn" data-cat="boygirl">Boy/Girlband</button>
                <button class="cat-btn" data-cat="90s">Era 90-an</button>
                <button class="cat-btn" data-cat="2000s">Era 2000-an</button>
                <button class="cat-btn" data-cat="2010s">Era 2010-an</button>
                <button class="cat-btn" data-cat="2020s">Era 2020-an</button>
                <button class="cat-btn" data-cat="solo">Soloist Hits</button>
            </div>

            <!-- Timeline (5 Langkah: 0.5s, 1s, 3s, 5s, 8s) -->
            <div class="timeline-container" id="timeline"></div>

            <!-- Slot Tebakan (5 Baris) -->
            <div class="attempts-list" id="attempts-list">
                <div class="attempt-slot">1.</div>
                <div class="attempt-slot">2.</div>
                <div class="attempt-slot">3.</div>
                <div class="attempt-slot">4.</div>
                <div class="attempt-slot">5.</div>
            </div>

            <!-- Tombol Play Audio Intro -->
            <div class="play-section">
                <button class="btn-play-pulse" id="btn-play" title="Putar Intro Lagu">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="duration-label" id="duration-info">Dengarkan Intro: 0.5 Detik</div>
            </div>

            <!-- Input Prediksi -->
            <div class="search-box">
                <div class="search-results" id="search-results"></div>
                <input type="text" id="guess-input" class="guess-input-field" placeholder="Ketik judul lagu atau nama penyanyi...">
            </div>

            <!-- Action Buttons -->
            <div class="action-row">
                <button class="btn btn-skip" id="btn-skip">Lewati (+1s)</button>
                <button class="btn btn-submit" id="btn-submit">Tebak</button>
            </div>
        </div>

        <!-- Result Card -->
        <div id="result-card" class="result-card hidden">
            <h2 id="result-title" style="margin-bottom: 5px; font-size: 1.5rem;"></h2>
            <p id="points-earned" style="color: var(--success); font-weight: 700; font-size: 0.95rem; margin-bottom: 10px;"></p>
            <img id="album-cover" src="" alt="Album Artwork">
            <h3 id="song-title-res" style="font-size: 1.25rem; font-weight: 700;"></h3>
            <p id="artist-res" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 22px;"></p>
            
            <button class="btn btn-submit" id="btn-next" style="width: 100%;">Lagu Selanjutnya ➔</button>
        </div>
    </div>

    <!-- Audio Player -->
    <audio id="audio-player"></audio>

    <script>
        // Sesuai permintaan: 0.5s, 1s, 3s, 5s, 8s (Total 5 step)
        const STEPS = [0.5, 1.0, 3.0, 5.0, 8.0];
        
        let trackPool = [];
        let currentTrack = null;
        let currentStep = 0;
        let currentCategory = "all";
        let score = 0;
        let streak = 0;
        let isGameOver = false;
        let audioTimeout = null;

        // Database ribuan keyword artis/band/boygirlband lintas era Indonesia
        const categoryKeywords = {
            'all': ['dewa 19', 'peterpan', 'sheila on 7', 'slank', 'ungu', 'kangen band', 'smsh', 'jkt48', 'cherrybelle', 'tulus', 'raisa', 'mahalini', 'noah', 'gigi', 'padi', 'kahitna', 'radja', 'st12', 'nidji', 'dmasiv', 'coboy junior', 'chrisye', 'glenn fredly', 'rossa', 'afgan'],
            'band': ['dewa 19', 'peterpan', 'sheila on 7', 'slank', 'ungu', 'kangen band', 'nidji', 'dmasiv', 'noah', 'geisha', 'gigi', 'padi', 'kahitna', 'radja', 'st12', 'armada', 'kotak', 'fourtwnty', 'barasuara', 'element', 'netral'],
            'boygirl': ['sm*sh', 'jkt48', 'cherrybelle', 'coboy junior', 'cjr', '7icons', 'blink', 's/m/s/h', 'super seven', 'vierra', 'project pop'],
            '90s': ['dewa 19', 'chrisye', 'slank', 'krisdayanti', 'kahitna', 'naif', 'jamrud', 'element', 'oppie andaresta', 'slank', 'iesty', 'armand', 'pas band', 'retro'],
            '2000s': ['peterpan', 'sheila on 7', 'ungu', 'radja', 'kangen band', 'nidji', 'dmasiv', 'st12', 'ada band', 'samsons', 'geisha', 'cokelat', 'gigi', 'project pop', 'anang krisdayanti'],
            '2010s': ['tulus', 'raisa', 'afgan', 'noah', 'isyana sarasvati', 'rizky febian', 'yura yunita', 'judika', 'payung teduh', 'bcl', 'virgoun', 'armada', 'jaz', 'barasuara'],
            '2020s': ['mahalini', 'tiara andini', 'ziva magnolya', 'fabio ashley', 'keisya levronka', 'lyodra', 'brisia jodie', 'nadin amizah', 'hindia', 'pamungkas', 'fiersa besari', 'sal priadi', 'maliq essentials'],
            'solo': ['tulus', 'raisa', 'afgan', 'glenn fredly', 'rossa', 'judika', 'isyana sarasvati', 'rizky febian', 'yura yunita', 'chrisye', 'krisdayanti', 'mahalini', 'tiara andini', 'pamungkas', 'virgoun', 'bcl']
        };

        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');
        const gameArea = document.getElementById('game-area');
        const resultCard = document.getElementById('result-card');
        const timeline = document.getElementById('timeline');
        const attemptsList = document.getElementById('attempts-list');
        const btnPlay = document.getElementById('btn-play');
        const durationInfo = document.getElementById('duration-info');
        const guessInput = document.getElementById('guess-input');
        const searchResults = document.getElementById('search-results');
        const btnSkip = document.getElementById('btn-skip');
        const btnSubmit = document.getElementById('btn-submit');
        const btnNext = document.getElementById('btn-next');
        const audioPlayer = document.getElementById('audio-player');
        const catBtns = document.querySelectorAll('.cat-btn');
        const totalScoreEl = document.getElementById('total-score');
        const streakCountEl = document.getElementById('streak-count');

        function renderTimeline() {
            timeline.innerHTML = '';
            const total = STEPS[STEPS.length - 1];
            STEPS.forEach((step, idx) => {
                const seg = document.createElement('div');
                seg.className = 'timeline-segment' + (idx <= currentStep ? ' active' : '');
                const prev = idx === 0 ? 0 : STEPS[idx - 1];
                seg.style.width = `${((step - prev) / total) * 100}%`;
                timeline.appendChild(seg);
            });
        }

        // Fetch ribuan lagu secara paralel dari iTunes API untuk memastikan database sangat besar
        async function fetchTracks(category) {
            loadingScreen.style.opacity = '1';
            loadingScreen.classList.remove('hidden');
            gameArea.classList.add('hidden');
            resultCard.classList.add('hidden');
            
            trackPool = [];
            const keywords = categoryKeywords[category] || categoryKeywords['all'];
            
            // Ambil acak 6-8 keyword secara bersamaan agar menghasilkan ratusan hingga ribuan lagu instan
            const shuffled = [...keywords].sort(() => 0.5 - Math.random()).slice(0, 7);

            try {
                loadingText.textContent = `Mengumpulkan ribuan lagu hits kategori ${category.toUpperCase()}...`;
                
                const fetchPromises = shuffled.map(kw => 
                    fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(kw)}&country=id&entity=song&limit=50`)
                    .then(res => res.json())
                );

                const results = await Promise.all(fetchPromises);
                
                results.forEach(data => {
                    if (data.results) {
                        const validTracks = data.results.filter(t => t.previewUrl);
                        trackPool = trackPool.concat(validTracks);
                    }
                });

                // Hapus duplikat ID lagu
                trackPool = trackPool.filter((track, index, self) =>
                    index === self.findIndex((t) => (t.trackId === track.trackId))
                );

                if (trackPool.length === 0) throw new Error("Kosong");

                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    startNewRound();
                }, 400);

            } catch (err) {
                loadingText.textContent = "Menghubungkan ulang ke server database lagu...";
                setTimeout(() => fetchTracks('all'), 1000);
            }
        }

        catBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                catBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
                fetchTracks(currentCategory);
            });
        });

        function startNewRound() {
            isGameOver = false;
            currentStep = 0;
            resultCard.classList.add('hidden');
            gameArea.classList.remove('hidden');

            currentTrack = trackPool[Math.floor(Math.random() * trackPool.length)];
            audioPlayer.src = currentTrack.previewUrl;

            const slots = attemptsList.querySelectorAll('.attempt-slot');
            slots.forEach((s, i) => {
                s.className = 'attempt-slot';
                s.textContent = `${i + 1}.`;
            });

            guessInput.value = '';
            guessInput.disabled = false;
            btnSkip.disabled = false;
            btnSubmit.disabled = false;

            updateStepUI();
        }

        function updateStepUI() {
            renderTimeline();
            const dur = STEPS[currentStep];
            durationInfo.textContent = `Dengarkan Intro: ${dur} Detik`;
            btnSkip.textContent = currentStep === 4 ? 'Menyerah' : `Lewati (+${STEPS[currentStep + 1] - dur}s)`;
        }

        // Mulai dari INTRO asli lagu (currentTime = 0) dengan durasi spesifik
        btnPlay.addEventListener('click', () => {
            if (!audioPlayer.src) return;
            if (audioTimeout) clearTimeout(audioTimeout);

            audioPlayer.currentTime = 0; // Pastikan dimulai dari intro awal lagu
            audioPlayer.play().catch(()=>{});

            audioTimeout = setTimeout(() => {
                audioPlayer.pause();
            }, STEPS[currentStep] * 1000);
        });

        // Autocomplete Pencarian Cerdas
        guessInput.addEventListener('input', () => {
            const val = guessInput.value.toLowerCase().trim();
            if (!val) {
                searchResults.style.display = 'none';
                return;
            }

            const matches = trackPool.filter(t => 
                t.trackName.toLowerCase().includes(val) || 
                t.artistName.toLowerCase().includes(val)
            ).slice(0, 5);

            if (matches.length > 0) {
                searchResults.innerHTML = '';
                matches.forEach(t => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.textContent = `${t.trackName} - ${t.artistName}`;
                    div.addEventListener('click', () => {
                        guessInput.value = div.textContent;
                        searchResults.style.display = 'none';
                    });
                    searchResults.appendChild(div);
                });
                searchResults.style.display = 'block';
            } else {
                searchResults.style.display = 'none';
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) searchResults.style.display = 'none';
        });

        btnSubmit.addEventListener('click', () => processGuess(guessInput.value.trim()));
        btnSkip.addEventListener('click', () => processGuess('SKIPPED'));

        function processGuess(guessText) {
            if (isGameOver) return;
            if (guessText === '' && guessText !== 'SKIPPED') return;

            const slots = attemptsList.querySelectorAll('.attempt-slot');
            const currentSlot = slots[currentStep];
            const fullName = `${currentTrack.trackName} - ${currentTrack.artistName}`;

            if (guessText.toLowerCase() === fullName.toLowerCase() || 
               (guessText.length > 3 && currentTrack.trackName.toLowerCase().includes(guessText.toLowerCase()))) {
                
                currentSlot.classList.add('correct');
                currentSlot.textContent = `✓ ${fullName}`;
                endRound(true);
                return;
            }

            if (guessText === 'SKIPPED') {
                currentSlot.classList.add('skipped');
                currentSlot.textContent = `🚫 Dilewati`;
            } else {
                currentSlot.classList.add('wrong');
                currentSlot.textContent = `✗ ${guessText}`;
            }

            if (currentStep < 4) {
                currentStep++;
                updateStepUI();
                guessInput.value = '';
            } else {
                endRound(false);
            }
        }

        function endRound(isWin) {
            isGameOver = true;
            audioPlayer.pause();
            guessInput.disabled = true;
            btnSkip.disabled = true;
            btnSubmit.disabled = true;

            setTimeout(() => {
                gameArea.classList.add('hidden');
                resultCard.classList.remove('hidden');

                const titleEl = document.getElementById('result-title');
                const pointsEl = document.getElementById('points-earned');

                if (isWin) {
                    titleEl.textContent = "LUAR BIASA! BENAR! 🎉";
                    titleEl.style.color = "var(--success)";
                    
                    // Poin berdasarkan kecepatan (Step 0 = 50pts, Step 4 = 10pts)
                    const earned = (5 - currentStep) * 10;
                    score += earned;
                    streak += 1;
                    pointsEl.textContent = `+${earned} Poin Berhasil Ditambahkan!`;
                } else {
                    titleEl.textContent = "JAWABAN SALAH, COBA LAGI! 😅";
                    titleEl.style.color = "var(--danger)";
                    streak = 0;
                    pointsEl.textContent = `Poin ditambah 0`;
                }

                totalScoreEl.textContent = score;
                streakCountEl.textContent = `${streak} 🔥`;

                const artworkUrl = currentTrack.artworkUrl100 ? currentTrack.artworkUrl100.replace('100x100bb', '400x400bb') : '';
                
                document.getElementById('album-cover').src = artworkUrl;
                document.getElementById('song-title-res').textContent = currentTrack.trackName;
                document.getElementById('artist-res').textContent = currentTrack.artistName;

                audioPlayer.currentTime = 0;
                audioPlayer.play().catch(() => {});
            }, 800);
        }

        btnNext.addEventListener('click', startNewRound);

        window.onload = () => {
            fetchTracks('all');
        };
    </script>
</body>
</html>
