<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Lagu - Pro Edition</title>
    <style>
        :root {
            --bg-deep: #0b0b0e;
            --bg-card: #141419;
            --bg-elevated: #1f1f26;
            --accent-primary: #ff3366;
            --accent-gradient: linear-gradient(135deg, #ff3366 0%, #ff9933 100%);
            --accent-green: #00e676;
            --accent-red: #ff1744;
            --text-main: #f8f9fa;
            --text-muted: #9494a0;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        /* Loading Screen Premium */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.4s ease;
        }

        .loader-ring {
            width: 55px; height: 55px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #loading-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* Header Profesional */
        .header {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
            max-width: 550px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Score & Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: var(--radius-md);
            margin-bottom: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .stats-bar span { color: var(--accent-primary); }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Era / Kategori Selector (Pill Scroller) */
        .category-wrapper {
            position: relative;
            margin-bottom: 5px;
        }

        .category-scroller {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .category-scroller::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .cat-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--text-main);
        }

        .cat-btn.active {
            background: var(--accent-gradient);
            color: #fff;
            font-weight: 700;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        /* Timeline Durasi Visual */
        .timeline-container {
            display: flex;
            height: 10px;
            background: var(--bg-card);
            border-radius: 5px;
            overflow: hidden;
            gap: 3px;
            padding: 2px;
            border: 1px solid var(--border-color);
        }

        .timeline-segment {
            background: var(--bg-elevated);
            height: 100%;
            border-radius: 3px;
            transition: background 0.3s ease;
        }
        .timeline-segment.active { background: var(--accent-primary); }

        /* Slot Percobaan (6 Baris) */
        .attempts-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .attempt-slot {
            height: 45px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .attempt-slot.wrong { border-color: var(--accent-red); color: var(--accent-red); background: rgba(255, 23, 68, 0.05); }
        .attempt-slot.skipped { border-color: rgba(255,255,255,0.15); color: var(--text-muted); }
        .attempt-slot.correct { border-color: var(--accent-green); color: var(--accent-green); font-weight: 700; background: rgba(0, 230, 118, 0.06); }

        /* Tombol Play Besar & Elegan */
        .play-section {
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            position: relative;
        }

        .btn-play-pulse {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: var(--accent-gradient);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-play-pulse:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 51, 102, 0.6);
        }

        .btn-play-pulse:active { transform: scale(0.96); }

        .btn-play-pulse svg {
            width: 28px; height: 28px; fill: #fff; margin-left: 3px;
        }

        .duration-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 10px;
            letter-spacing: 0.3px;
        }

        /* Search Autocomplete Box */
        .search-box { position: relative; }
        
        .search-results {
            position: absolute;
            bottom: calc(100% + 6px); left: 0; right: 0;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            max-height: 220px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
        }

        .search-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            transition: background 0.15s;
        }
        .search-item:hover { background: rgba(255,255,255,0.06); color: var(--accent-primary); }

        .guess-input-field {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .guess-input-field:focus { border-color: var(--accent-primary); }

        /* Action Buttons Row */
        .action-row { display: flex; gap: 10px; }
        
        .btn {
            padding: 13px; border-radius: var(--radius-md); border: none; font-weight: 600;
            cursor: pointer; font-size: 0.88rem; flex: 1;
            transition: filter 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-skip { background: var(--bg-elevated); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-submit { background: var(--accent-gradient); color: #fff; box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3); }

        /* Layar Hasil Akhir Profesional */
        .result-card {
            text-align: center;
            background: var(--bg-card);
            padding: 35px 25px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        .result-card img {
            width: 160px; height: 160px;
            border-radius: 12px; margin: 15px 0 20px 0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            object-fit: cover;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-screen">
        <div class="loader-ring"></div>
        <p id="loading-text">Memuat ribuan koleksi lagu hits Indonesia...</p>
    </div>

    <div class="header">
        <h1>SONGSPOT INDO</h1>
        <p>Tebak lagu legendaris & hits dari masa ke masa</p>
    </div>

    <div class="container">
        <!-- Panel Game Utama -->
        <div id="game-area" class="hidden">
            
            <div class="stats-bar">
                <div>Skor Total: <span id="total-score">0</span></div>
                <div>Streak: <span id="streak-count">0 🔥</span></div>
            </div>

            <!-- Kategori/Era Pilihan -->
            <div class="category-wrapper">
                <div class="category-scroller">
                    <button class="cat-btn active" data-cat="all">Semua Hits</button>
                    <button class="cat-btn" data-cat="90s">Era 90-an</button>
                    <button class="cat-btn" data-cat="2000s">Era 2000-an</button>
                    <button class="cat-btn" data-cat="2010s">Era 2010-an</button>
                    <button class="cat-btn" data-cat="2020s">Era 2020-an</button>
                    <button class="cat-btn" data-cat="band">Band Legendaris</button>
                    <button class="cat-btn" data-cat="solo">Soloist Hits</button>
                    <button class="cat-btn" data-cat="boygirl">Boy/Girlband</button>
                </div>
            </div>

            <!-- Timeline Visual Durasi -->
            <div class="timeline-container" id="timeline"></div>

            <!-- Slot Percobaan Jawaban -->
            <div class="attempts-list" id="attempts-list">
                <div class="attempt-slot">1.</div>
                <div class="attempt-slot">2.</div>
                <div class="attempt-slot">3.</div>
                <div class="attempt-slot">4.</div>
                <div class="attempt-slot">5.</div>
                <div class="attempt-slot">6.</div>
            </div>

            <!-- Kotak Pemutar Audio Utama -->
            <div class="play-section">
                <button class="btn-play-pulse" id="btn-play" title="Putar Cuplikan Lagu">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="duration-label" id="duration-info">Dengarkan: 0.5 Detik</div>
            </div>

            <!-- Input Pencarian Prediktif -->
            <div class="search-box">
                <div class="search-results" id="search-results"></div>
                <input type="text" id="guess-input" class="guess-input-field" placeholder="Ketik judul lagu atau nama penyanyi...">
            </div>

            <!-- Tombol Navigasi/Aksi -->
            <div class="action-row">
                <button class="btn btn-skip" id="btn-skip">Lewati (+1s)</button>
                <button class="btn btn-submit" id="btn-submit">Tebak</button>
            </div>
        </div>

        <!-- Tampilan Hasil Akhir -->
        <div id="result-card" class="result-card hidden">
            <h2 id="result-title" style="margin-bottom: 5px; font-size: 1.5rem;"></h2>
            <p id="points-earned" style="color: var(--accent-green); font-weight: 600; font-size: 0.95rem; margin-bottom: 10px;"></p>
            <img id="album-cover" src="" alt="Album Artwork">
            <h3 id="song-title-res" style="font-size: 1.25rem; font-weight: 700;"></h3>
            <p id="artist-res" style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 22px;"></p>
            
            <button class="btn btn-submit" id="btn-next" style="width: 100%;">Lagu Selanjutnya ➔</button>
        </div>
    </div>

    <!-- Audio Player Tersembunyi -->
    <audio id="audio-player"></audio>

    <script>
        const STEPS = [0.5, 1.0, 2.0, 4.0, 7.0, 16.0];
        
        let trackPool = [];
        let currentTrack = null;
        let currentStep = 0;
        let currentCategory = "all";
        let score = 0;
        let streak = 0;
        let isGameOver = false;
        let audioTimeout = null;

        // Database Kategori & Artis Hits Indonesia yang Sangat Luas (Ribuan Kombinasi Pencarian)
        const categoryKeywords = {
            'all': ['peterpan', 'dewa 19', 'sheila on 7', 'tulus', 'mahalini', 'raisa', 'glenn fredly', 'rossa', 'afgan', 'judika', 'noah', 'ari lasso', 'ungu', 'kangen band', 'rizky febian', 'tiara andini', 'chrisye', 'fourtwnty', 'nadn amizah'],
            '90s': ['dewa 19', 'chrisye', 'slank', 'krisdayanti', 'kahitna', 'naif', 'jamrud', 'element', 'armand giovani', 'netral', 'tohpati', 'oppie andaresta', 'rita sugiarto'],
            '2000s': ['peterpan', 'sheila on 7', 'ungu', 'radja', 'kangen band', 'nidji', 'dmasiv', 'st12', 'ada band', 'samsons', 'geisha', 'cokelat', 'gigi', 'project pop', 'viera', 'anang krisdayanti'],
            '2010s': ['tulus', 'raisa', 'afgan', 'noah', 'isyana sarasvati', 'rizky febian', 'yura yunita', 'judika', 'payung teduh', 'barasuara', 'bcl', 'virgoun', 'armada', 'jaz'],
            '2020s': ['mahalini', 'tiara andini', 'ziva magnolya', 'fabio ashley', 'keisya levronka', 'lyodra', 'brisia jodie', 'nadin amizah', 'hindia', 'pamungkas', 'fiersa besari', 'vierratalia', 'rizky febian ziva'],
            'band': ['dewa 19', 'peterpan', 'sheila on 7', 'slank', 'ungu', 'kangen band', 'nidji', 'dmasiv', 'noah', 'geisha', 'gigi', 'padi', 'kahitna', 'radja', 'st12', 'fourtwnty'],
            'solo': ['tulus', 'raisa', 'afgan', 'glenn fredly', 'rossa', 'judika', 'isana sarasvati', 'rizky febian', 'yura yunita', 'chrisye', 'krisdayanti', 'mahalini', 'tiara andini', 'pamungkas'],
            'boygirl': ['jkt48', 'sm*sh', 'coboy junior', 'cherrybelle', '7icons', 'blink', 'cjra', 'unicorn', 's/m/s/h']
        };

        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');
        const gameArea = document.getElementById('game-area');
        const resultCard = document.getElementById('result-card');
        const timeline = document.getElementById('timeline');
        const attemptsList = document.getElementById('attempts-list');
        const btnPlay = document.getElementById('btn-play');
        const durationInfo = document.getElementById('duration-info');
        const guessInput = document.getElementById('guess-input');
        const searchResults = document.getElementById('search-results');
        const btnSkip = document.getElementById('btn-skip');
        const btnSubmit = document.getElementById('btn-submit');
        const btnNext = document.getElementById('btn-next');
        const audioPlayer = document.getElementById('audio-player');
        const catBtns = document.querySelectorAll('.cat-btn');
        const totalScoreEl = document.getElementById('total-score');
        const streakCountEl = document.getElementById('streak-count');

        function renderTimeline() {
            timeline.innerHTML = '';
            const total = STEPS[STEPS.length - 1];
            STEPS.forEach((step, idx) => {
                const seg = document.createElement('div');
                seg.className = 'timeline-segment' + (idx <= currentStep ? ' active' : '');
                const prev = idx === 0 ? 0 : STEPS[idx - 1];
                seg.style.width = `${((step - prev) / total) * 100}%`;
                timeline.appendChild(seg);
            });
        }

        // Fetch Ribuan Koleksi Lagu secara Paralel dari iTunes API Terbuka
        async function fetchTracks(category) {
            loadingScreen.style.opacity = '1';
            loadingScreen.classList.remove('hidden');
            gameArea.classList.add('hidden');
            resultCard.classList.add('hidden');
            
            trackPool = [];
            const keywords = categoryKeywords[category] || categoryKeywords['all'];
            
            // Ambil acak 5-6 keyword secara bersamaan untuk memperkaya ribuan hasil lagu instan
            const shuffled = [...keywords].sort(() => 0.5 - Math.random()).slice(0, 5);

            try {
                loadingText.textContent = `Menyelaraskan database hits ${category.toUpperCase()}...`;
                
                const fetchPromises = shuffled.map(kw => 
                    fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(kw)}&country=id&entity=song&limit=50`)
                    .then(res => res.json())
                );

                const results = await Promise.all(fetchPromises);
                
                results.forEach(data => {
                    if (data.results) {
                        const validTracks = data.results.filter(t => t.previewUrl);
                        trackPool = trackPool.concat(validTracks);
                    }
                });

                // Hapus duplikat track ID agar unik
                trackPool = trackPool.filter((track, index, self) =>
                    index === self.findIndex((t) => (t.trackId === track.trackId))
                );

                if (trackPool.length === 0) throw new Error("Kosong");

                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.classList.add('hidden');
                    startNewRound();
                }, 300);

            } catch (err) {
                loadingText.textContent = "Memuat ulang cadangan server lagu...";
                setTimeout(() => fetchTracks('all'), 1000);
            }
        }

        catBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                catBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
                fetchTracks(currentCategory);
            });
        });

        function startNewRound() {
            isGameOver = false;
            currentStep = 0;
            resultCard.classList.add('hidden');
            gameArea.classList.remove('hidden');

            currentTrack = trackPool[Math.floor(Math.random() * trackPool.length)];
            audioPlayer.src = currentTrack.previewUrl;

            const slots = attemptsList.querySelectorAll('.attempt-slot');
            slots.forEach((s, i) => {
                s.className = 'attempt-slot';
                s.textContent = `${i + 1}.`;
            });

            guessInput.value = '';
            guessInput.disabled = false;
            btnSkip.disabled = false;
            btnSubmit.disabled = false;

            updateStepUI();
        }

        function updateStepUI() {
            renderTimeline();
            const dur = STEPS[currentStep];
            durationInfo.textContent = `Dengarkan: ${dur} Detik`;
            btnSkip.textContent = currentStep === 5 ? 'Menyerah' : `Lewati (+${STEPS[currentStep + 1] - dur}s)`;
        }

        btnPlay.addEventListener('click', () => {
            if (!audioPlayer.src) return;
            if (audioTimeout) clearTimeout(audioTimeout);

            audioPlayer.currentTime = 0;
            audioPlayer.play().catch(()=>{});

            audioTimeout = setTimeout(() => {
                audioPlayer.pause();
            }, STEPS[currentStep] * 1000);
        });

        // Autocomplete Pencarian Cerdas
        guessInput.addEventListener('input', () => {
            const val = guessInput.value.toLowerCase().trim();
            if (!val) {
                searchResults.style.display = 'none';
                return;
            }

            const matches = trackPool.filter(t => 
                t.trackName.toLowerCase().includes(val) || 
                t.artistName.toLowerCase().includes(val)
            ).slice(0, 5);

            if (matches.length > 0) {
                searchResults.innerHTML = '';
                matches.forEach(t => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.textContent = `${t.trackName} - ${t.artistName}`;
                    div.addEventListener('click', () => {
                        guessInput.value = div.textContent;
                        searchResults.style.display = 'none';
                    });
                    searchResults.appendChild(div);
                });
                searchResults.style.display = 'block';
            } else {
                searchResults.style.display = 'none';
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) searchResults.style.display = 'none';
        });

        btnSubmit.addEventListener('click', () => processGuess(guessInput.value.trim()));
        btnSkip.addEventListener('click', () => processGuess('SKIPPED'));

        function processGuess(guessText) {
            if (isGameOver) return;
            if (guessText === '' && guessText !== 'SKIPPED') return;

            const slots = attemptsList.querySelectorAll('.attempt-slot');
            const currentSlot = slots[currentStep];
            const fullName = `${currentTrack.trackName} - ${currentTrack.artistName}`;

            if (guessText.toLowerCase() === fullName.toLowerCase() || 
               (guessText.length > 3 && currentTrack.trackName.toLowerCase().includes(guessText.toLowerCase()))) {
                
                currentSlot.classList.add('correct');
                currentSlot.textContent = `✓ ${fullName}`;
                endRound(true);
                return;
            }

            if (guessText === 'SKIPPED') {
                currentSlot.classList.add('skipped');
                currentSlot.textContent = `🚫 Dilewati`;
            } else {
                currentSlot.classList.add('wrong');
                currentSlot.textContent = `✗ ${guessText}`;
            }

            if (currentStep < 5) {
                currentStep++;
                updateStepUI();
                guessInput.value = '';
            } else {
                endRound(false);
            }
        }

        function endRound(isWin) {
            isGameOver = true;
            audioPlayer.pause();
            guessInput.disabled = true;
            btnSkip.disabled = true;
            btnSubmit.disabled = true;

            setTimeout(() => {
                gameArea.classList.add('hidden');
                resultCard.classList.remove('hidden');

                const titleEl = document.getElementById('result-title');
                const pointsEl = document.getElementById('points-earned');

                if (isWin) {
                    titleEl.textContent = "LUAR BIASA! BENAR! 🎉";
                    titleEl.style.color = "var(--accent-green)";
                    
                    // Hitung poin berdasarkan kecepatan step tebakan (Step 0 = 60pts, Step 5 = 10pts)
                    const earned = (6 - currentStep) * 10;
                    score += earned;
                    streak += 1;
                    pointsEl.textContent = `+${earned} Poin Berhasil Didapatkan!`;
                } else {
                    titleEl.textContent = "SAYANG SEKALI, COBA LAGI! 😅";
                    titleEl.style.color = "var(--accent-red)";
                    streak = 0;
                    pointsEl.textContent = `Poin ditambah 0`;
                }

                totalScoreEl.textContent = score;
                streakCountEl.textContent = `${streak} 🔥`;

                const artworkUrl = currentTrack.artworkUrl100 ? currentTrack.artworkUrl100.replace('100x100bb', '400x400bb') : '';
                
                document.getElementById('album-cover').src = artworkUrl;
                document.getElementById('song-title-res').textContent = currentTrack.trackName;
                document.getElementById('artist-res').textContent = currentTrack.artistName;

                audioPlayer.currentTime = 0;
                audioPlayer.play().catch(() => {});
            }, 800);
        }

        btnNext.addEventListener('click', startNewRound);

        // Eksekusi Awal Otomatis
        window.onload = () => {
            fetchTracks('all');
        };
    </script>
</body>
</html>
