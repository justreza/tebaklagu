<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Lagu - Ultimate Indonesian Music Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #030307;
            --bg-surface: #0e0e16;
            --bg-elevated: #161622;
            --accent-glow: rgba(124, 58, 237, 0.25);
            --accent-primary: #8b5cf6;
            --accent-secondary: #ec4899;
            --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            --level-gradient: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            --success: #10b981;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 28px 16px;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(236, 72, 153, 0.12) 0%, transparent 45%);
            background-attachment: fixed;
        }

        #loading-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-base); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 2000;
            transition: opacity 0.5s ease; padding: 20px; text-align: center;
        }

        .loader-spinner {
            width: 64px; height: 64px; border: 4px solid var(--border);
            border-top: 4px solid var(--accent-primary); border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #loading-text { font-size: 0.95rem; color: var(--text-muted); font-weight: 500; }

        .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 540px; }
        .header h1 { font-size: 2.6rem; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        .header p { font-size: 0.88rem; color: var(--text-muted); margin-top: 6px; }

        .stats-bar {
            display: flex; justify-content: space-between; background: var(--bg-surface);
            border: 1px solid var(--border); padding: 14px 22px; border-radius: var(--radius-lg);
            margin-bottom: 16px; font-size: 0.9rem; font-weight: 600;
        }
        .stats-bar span { color: var(--accent-secondary); }

        .container { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 12px; }

        .scroll-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .scroll-container::-webkit-scrollbar { display: none; }

        .filter-btn {
            background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border);
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.82rem;
            font-weight: 600; white-space: nowrap; transition: all 0.2s;
        }
        .filter-btn:hover { border-color: rgba(255, 255, 255, 0.25); color: var(--text-main); }
        .cat-btn.active { background: var(--accent-gradient); color: #fff; border-color: transparent; }
        .lvl-btn.active { background: var(--level-gradient); color: #fff; border-color: transparent; }

        .filter-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; margin-top: 8px; }

        .timeline-container { display: flex; height: 12px; background: var(--bg-surface); border-radius: 8px; overflow: hidden; gap: 4px; padding: 3px; border: 1px solid var(--border); margin-top: 8px;}
        .timeline-segment { background: var(--bg-elevated); height: 100%; border-radius: 5px; transition: background 0.3s ease; }
        .timeline-segment.active { background: var(--accent-primary); box-shadow: 0 0 10px var(--accent-primary); }

        .attempts-list { display: flex; flex-direction: column; gap: 8px; }
        .attempt-slot {
            height: 44px; background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); display: flex; align-items: center; padding: 0 18px;
            font-size: 0.88rem; color: var(--text-muted); font-weight: 500;
        }
        .attempt-slot.wrong { border-color: var(--danger); color: var(--danger); background: rgba(244, 63, 94, 0.06); }
        .attempt-slot.skipped { border-color: rgba(255,255,255,0.15); }
        .attempt-slot.correct { border-color: var(--success); color: var(--success); font-weight: 700; background: rgba(16, 185, 129, 0.08); }

        .play-section { text-align: center; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 24px; position: relative; }
        .btn-play-pulse {
            width: 72px; height: 72px; border-radius: 50%; background: var(--accent-gradient);
            border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5); transition: transform 0.2s;
        }
        .btn-play-pulse:active { transform: scale(0.95); }
        .btn-play-pulse svg { width: 32px; height: 32px; fill: #fff; margin-left: 3px; }
        .duration-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 14px; font-weight: 600; }

        .search-box { position: relative; }
        .search-results {
            position: absolute; bottom: calc(100% + 8px); left: 0; right: 0; background: var(--bg-elevated);
            border: 1px solid var(--accent-primary); border-radius: var(--radius-lg); max-height: 200px;
            overflow-y: auto; z-index: 100; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .search-item { padding: 12px 18px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .search-item:hover { background: rgba(139, 92, 246, 0.15); color: var(--accent-secondary); }

        .guess-input-field {
            width: 100%; padding: 16px 20px; background: rgba(22, 22, 34, 0.85);
            border: 2px solid rgba(139, 92, 246, 0.4); border-radius: var(--radius-lg);
            color: var(--text-main); font-size: 0.95rem; font-weight: 500; outline: none;
        }
        .guess-input-field:focus { border-color: var(--accent-secondary); background: var(--bg-surface); }

        .action-row { display: flex; gap: 10px; }
        .btn { padding: 14px; border-radius: var(--radius-lg); border: none; font-weight: 700; cursor: pointer; flex: 1; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-skip { background: var(--bg-elevated); color: var(--text-main); border: 1px solid var(--border); }
        .btn-submit { background: var(--accent-gradient); color: #fff; box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4); }

        .result-card { text-align: center; background: var(--bg-surface); padding: 36px 24px; border-radius: var(--radius-xl); border: 1px solid var(--border); }
        .result-card img { width: 160px; height: 160px; border-radius: var(--radius-lg); margin: 15px 0 20px 0; object-fit: cover; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-spinner"></div>
        <p id="loading-text">Menyiapkan database lagu...</p>
    </div>

    <div class="header">
        <h1>GUESS LAGU</h1>
        <p>Uji pengetahuan musikmu dari berbagai era & level kesulitan!</p>
    </div>

    <div class="container">
        <div id="game-area" class="hidden">
            
            <div class="stats-bar">
                <div>Skor: <span id="total-score">0</span></div>
                <div>Streak: <span id="streak-count">0 🔥</span></div>
            </div>

            <!-- Era / Kategori Filter -->
            <div class="filter-label">Pilih Era / Kategori</div>
            <div class="scroll-container category-scroller">
                <button class="filter-btn cat-btn active" data-cat="alltime">All Time</button>
                <button class="filter-btn cat-btn" data-cat="90s">90an</button>
                <button class="filter-btn cat-btn" data-cat="2000s">2000an</button>
                <button class="filter-btn cat-btn" data-cat="2010s">2010an</button>
                <button class="filter-btn cat-btn" data-cat="2020s">2020an</button>
                <button class="filter-btn cat-btn" data-cat="random">Random</button>
            </div>

            <!-- Level Filter -->
            <div class="filter-label">Pilih Tingkat Kesulitan</div>
            <div class="scroll-container level-scroller">
                <button class="filter-btn lvl-btn" data-lvl="se">Super Gampang</button>
                <button class="filter-btn lvl-btn" data-lvl="e">Gampang</button>
                <button class="filter-btn lvl-btn active" data-lvl="m">Sedang</button>
                <button class="filter-btn lvl-btn" data-lvl="h">Susah</button>
                <button class="filter-btn lvl-btn" data-lvl="sh">Susah Banget</button>
            </div>

            <div class="timeline-container" id="timeline"></div>

            <div class="attempts-list" id="attempts-list">
                <div class="attempt-slot">1.</div>
                <div class="attempt-slot">2.</div>
                <div class="attempt-slot">3.</div>
                <div class="attempt-slot">4.</div>
                <div class="attempt-slot">5.</div>
            </div>

            <div class="play-section">
                <button class="btn-play-pulse" id="btn-play" title="Putar Intro Lagu">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="duration-label" id="duration-info">Dengarkan Intro: 0.5 Detik</div>
            </div>

            <div class="search-box">
                <div class="search-results" id="search-results"></div>
                <input type="text" id="guess-input" class="guess-input-field" placeholder="Ketik judul lagu...">
            </div>

            <div class="action-row">
                <button class="btn btn-skip" id="btn-skip">Lewati (+1s)</button>
                <button class="btn btn-submit" id="btn-submit">Tebak</button>
            </div>
        </div>

        <div id="result-card" class="result-card hidden">
            <h2 id="result-title" style="margin-bottom: 5px; font-size: 1.6rem;"></h2>
            <p id="points-earned" style="color: var(--success); font-weight: 700; font-size: 0.95rem; margin-bottom: 12px;"></p>
            <img id="album-cover" src="" alt="Album Artwork">
            <h3 id="song-title-res" style="font-size: 1.3rem; font-weight: 700;"></h3>
            <p id="artist-res" style="color: var(--text-muted); font-size: 0.92rem; margin-bottom: 24px;"></p>
            <button class="btn btn-submit" id="btn-next" style="width: 100%;">Lagu Selanjutnya ➔</button>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const STEPS = [0.5, 1.0, 3.0, 5.0, 8.0];
        
        // --- DATABASE KELENGKAPAN ARTIS BERDASARKAN KODE USER ---
        const categoryKeywords = {
            '90s': [
                'Dewa 19', 'Chrisye', 'Slank', 'Krisdayanti', 'Kahitna', 'Naif', 'Jamrud', 
                'Element', 'Iwa K', 'Pas Band', 'Potret', 'Base Jam', 'KLA Project', 
                'Nike Ardilla', 'Poppy Mercury', 'Java Jive', 'Stinky', 'Gigi', 'Padi'
            ],
            '2000s': [
                'Peterpan', 'Sheila On 7', 'Ungu', 'Radja', 'Kangen Band', 'Kerispatih', 
                'Letto', 'Hijau Daun', 'J-Rocks', 'Nidji', 'dMasiv', 'ST12', 'ADA Band', 
                'Samsons', 'Geisha', 'Cokelat', 'Repvblik', 'Wali', 'The Titans', 
                'Seventeen', 'Naff', 'Drive', 'Vierra', 'D Bagindas'
            ],
            '2010s': [
                'HIVI!', 'Cherrybelle', 'SM*SH', 'JKT48', 'Coboy Junior', 'CJR', '7Icons', 
                'Blink Sendiri Lagi', 'Blink Percayalah', 'Blink Dag Dig Dug', 'Blink Seindah Biasa',
                'Tulus', 'Raisa', 'Afgan', 'NOAH', 'Isyana Sarasvati', 'Rizky Febian', 
                'Yura Yunita', 'Judika', 'Payung Teduh', 'Fourtwnty', 'Armada', 'Last Child', 
                'Virgoun', 'RAN', 'Jaz', 'Anji', 'Fiersa Besari', 'GAC'
            ],
            '2020s': [
                'Mahalini', 'Tiara Andini', 'Ziva Magnolya', 'Fabio Asher', 'Keisya Levronka', 
                'Lyodra', 'Nadin Amizah', 'Hindia', 'Pamungkas', 'Sal Priadi', 'Juicy Luicy', 
                'Bernadya', 'Feby Putri', 'Raim Laode', 'Idgitaf'
            ],
            'alltime': [],
            'random': []
        };

        let currentCategory = "alltime";
        let currentLevel = "m"; // Default: Sedang
        
        let trackPool = [];
        let availableTracks = [];
        let lastArtistName = "";
        let currentTrack = null;
        let currentStep = 0;
        let score = 0;
        let streak = 0;
        let isGameOver = false;
        let audioTimeout = null;

        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');
        const gameArea = document.getElementById('game-area');
        const resultCard = document.getElementById('result-card');
        const timeline = document.getElementById('timeline');
        const attemptsList = document.getElementById('attempts-list');
        const guessInput = document.getElementById('guess-input');
        const searchResults = document.getElementById('search-results');
        const audioPlayer = document.getElementById('audio-player');
        
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
                fetchTracks();
            });
        });

        document.querySelectorAll('.lvl-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLevel = btn.dataset.lvl;
                fetchTracks();
            });
        });

        function cleanSongTitle(title) {
            return title.split('-')[0].split('(')[0].trim();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderTimeline() {
            timeline.innerHTML = '';
            const total = STEPS[STEPS.length - 1];
            STEPS.forEach((step, idx) => {
                const seg = document.createElement('div');
                seg.className = 'timeline-segment' + (idx <= currentStep ? ' active' : '');
                const prev = idx === 0 ? 0 : STEPS[idx - 1];
                seg.style.width = `${((step - prev) / total) * 100}%`;
                timeline.appendChild(seg);
            });
        }

        function getKeywords() {
            let keys = [];
            if (currentCategory === 'alltime') {
                for (let era in categoryKeywords) {
                    if (era !== 'alltime' && era !== 'random') {
                        keys = keys.concat(categoryKeywords[era]);
                    }
                }
            } else if (currentCategory === 'random') {
                let all = [];
                for (let era in categoryKeywords) {
                    if (era !== 'alltime' && era !== 'random') {
                        all = all.concat(categoryKeywords[era]);
                    }
                }
                shuffleArray(all);
                keys = all.slice(0, 12);
            } else {
                keys = categoryKeywords[currentCategory] || [];
            }
            return keys;
        }

        async function fetchTracks() {
            loadingScreen.style.opacity = '1';
            loadingScreen.classList.remove('hidden');
            gameArea.classList.add('hidden');
            resultCard.classList.add('hidden');
            
            trackPool = [];
            let keywords = getKeywords();
            
            shuffleArray(keywords);
            const selectedKeywords = keywords.slice(0, 8); // Ambil 8 artis acak untuk efisiensi request API

            try {
                loadingText.textContent = `Menyinkronkan lagu dari database artis...`;
                
                // Minta limit 50 agar bisa memfilter berdasarkan level (hits vs album tracks)
                const fetchPromises = selectedKeywords.map(kw => 
                    fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(kw)}&country=id&entity=song&limit=50`)
                    .then(res => res.json())
                );

                const results = await Promise.all(fetchPromises);
                const trackMap = new Map();

                results.forEach(data => {
                    if (data.results && data.results.length > 0) {
                        // Saring versi non-original
                        const validTracks = data.results.filter(t => {
                            if (!t.previewUrl) return false;
                            const lowerName = t.trackName.toLowerCase();
                            return !/remix|acoustic|live|instrumental|karaoke|version|remaster/i.test(lowerName);
                        });

                        // Terapkan level berdasarkan urutan popularitas dari iTunes API
                        // Super Gampang: Top hits (0-3), Susah Banget: Album tracks/dalam (index > 20)
                        let slicedTracks = [];
                        if (currentLevel === 'se') slicedTracks = validTracks.slice(0, 4);
                        else if (currentLevel === 'e') slicedTracks = validTracks.slice(3, 10);
                        else if (currentLevel === 'm') slicedTracks = validTracks.slice(8, 20);
                        else if (currentLevel === 'h') slicedTracks = validTracks.slice(18, 32);
                        else if (currentLevel === 'sh') slicedTracks = validTracks.slice(30);

                        if (slicedTracks.length === 0) slicedTracks = validTracks; // Fallback jika list sedikit

                        slicedTracks.forEach(t => {
                            const cleanedTitle = cleanSongTitle(t.trackName);
                            const uniqueKey = `${cleanedTitle.toLowerCase()} - ${t.artistName.toLowerCase()}`;
                            
                            if (!trackMap.has(uniqueKey)) {
                                trackMap.set(uniqueKey, { ...t, cleanedTitle: cleanedTitle });
                            }
                        });
                    }
                });

                trackPool = Array.from(trackMap.values());
                if (trackPool.length === 0) throw new Error("Kosong");

                availableTracks = [...trackPool];
                shuffleArray(availableTracks);

                loadingScreen.style.opacity = '0';
                setTimeout(() => { loadingScreen.classList.add('hidden'); startNewRound(); }, 400);

            } catch (err) {
                loadingText.textContent = "Gagal memuat. Mencoba ulang sinkronisasi...";
                setTimeout(() => fetchTracks(), 1500);
            }
        }

        function getNextTrack() {
            if (availableTracks.length === 0) {
                availableTracks = [...trackPool];
                shuffleArray(availableTracks);
            }

            let index = availableTracks.findIndex(t => t.artistName.toLowerCase() !== lastArtistName.toLowerCase());
            if (index === -1) index = 0;

            const selected = availableTracks.splice(index, 1)[0];
            lastArtistName = selected.artistName;
            return selected;
        }

        function startNewRound() {
            isGameOver = false;
            currentStep = 0;
            resultCard.classList.add('hidden');
            gameArea.classList.remove('hidden');

            currentTrack = getNextTrack();
            audioPlayer.src = currentTrack.previewUrl;

            const slots = attemptsList.querySelectorAll('.attempt-slot');
            slots.forEach((s, i) => { s.className = 'attempt-slot'; s.textContent = `${i + 1}.`; });

            guessInput.value = ''; guessInput.disabled = false;
            document.getElementById('btn-skip').disabled = false;
            document.getElementById('btn-submit').disabled = false;

            updateStepUI();
        }

        function updateStepUI() {
            renderTimeline();
            const dur = STEPS[currentStep];
            document.getElementById('duration-info').textContent = `Dengarkan Intro: ${dur} Detik`;
            const btnSkip = document.getElementById('btn-skip');
            btnSkip.textContent = currentStep === 4 ? 'Menyerah' : `Lewati (+${STEPS[currentStep + 1] - dur}s)`;
        }

        document.getElementById('btn-play').addEventListener('click', () => {
            if (!audioPlayer.src) return;
            if (audioTimeout) clearTimeout(audioTimeout);
            audioPlayer.currentTime = 0; audioPlayer.play().catch(()=>{});
            audioTimeout = setTimeout(() => { audioPlayer.pause(); }, STEPS[currentStep] * 1000);
        });

        guessInput.addEventListener('input', () => {
            const val = guessInput.value.toLowerCase().trim();
            if (!val) { searchResults.style.display = 'none'; return; }

            const matches = trackPool.filter(t => 
                t.cleanedTitle.toLowerCase().includes(val) || t.artistName.toLowerCase().includes(val)
            ).slice(0, 5);

            if (matches.length > 0) {
                searchResults.innerHTML = '';
                matches.forEach(t => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.textContent = `${t.cleanedTitle} - ${t.artistName}`;
                    div.addEventListener('click', () => {
                        guessInput.value = div.textContent;
                        searchResults.style.display = 'none';
                    });
                    searchResults.appendChild(div);
                });
                searchResults.style.display = 'block';
            } else { searchResults.style.display = 'none'; }
        });

        document.addEventListener('click', (e) => { if (!e.target.closest('.search-box')) searchResults.style.display = 'none'; });
        document.getElementById('btn-submit').addEventListener('click', () => processGuess(guessInput.value.trim()));
        document.getElementById('btn-skip').addEventListener('click', () => processGuess('SKIPPED'));

        function processGuess(guessText) {
            if (isGameOver) return;
            if (guessText === '' && guessText !== 'SKIPPED') return;

            const slots = attemptsList.querySelectorAll('.attempt-slot');
            const currentSlot = slots[currentStep];
            const fullName = `${currentTrack.cleanedTitle} - ${currentTrack.artistName}`;

            if (guessText.toLowerCase() === fullName.toLowerCase() || 
               (guessText.length > 3 && currentTrack.cleanedTitle.toLowerCase().includes(guessText.toLowerCase()))) {
                currentSlot.classList.add('correct');
                currentSlot.textContent = `✓ ${fullName}`;
                endRound(true); return;
            }

            if (guessText === 'SKIPPED') {
                currentSlot.classList.add('skipped'); currentSlot.textContent = `🚫 Dilewati`;
            } else {
                currentSlot.classList.add('wrong'); currentSlot.textContent = `✗ ${guessText}`;
            }

            if (currentStep < 4) { currentStep++; updateStepUI(); guessInput.value = ''; } 
            else { endRound(false); }
        }

        function endRound(isWin) {
            isGameOver = true; audioPlayer.pause();
            guessInput.disabled = true; document.getElementById('btn-skip').disabled = true; document.getElementById('btn-submit').disabled = true;

            setTimeout(() => {
                gameArea.classList.add('hidden'); resultCard.classList.remove('hidden');
                const titleEl = document.getElementById('result-title');
                const pointsEl = document.getElementById('points-earned');

                let multiplier = 1;
                if(currentLevel === 'e') multiplier = 1.2;
                if(currentLevel === 'm') multiplier = 1.5;
                if(currentLevel === 'h') multiplier = 2;
                if(currentLevel === 'sh') multiplier = 3;

                if (isWin) {
                    titleEl.textContent = "LUAR BIASA! BENAR! 🎉"; titleEl.style.color = "var(--success)";
                    const baseEarned = (5 - currentStep) * 10;
                    const earned = Math.floor(baseEarned * multiplier);
                    score += earned; streak += 1;
                    pointsEl.textContent = `+${earned} Poin Berhasil Ditambahkan!`;
                } else {
                    titleEl.textContent = "JAWABAN SALAH, COBA LAGI! 😅"; titleEl.style.color = "var(--danger)";
                    streak = 0; pointsEl.textContent = `Poin ditambah 0`;
                }

                document.getElementById('total-score').textContent = score;
                document.getElementById('streak-count').textContent = `${streak} 🔥`;

                document.getElementById('album-cover').src = currentTrack.artworkUrl100 ? currentTrack.artworkUrl100.replace('100x100bb', '400x400bb') : '';
                document.getElementById('song-title-res').textContent = currentTrack.cleanedTitle;
                document.getElementById('artist-res').textContent = currentTrack.artistName;

                audioPlayer.currentTime = 0; audioPlayer.play().catch(() => {});
            }, 800);
        }

        document.getElementById('btn-next').addEventListener('click', startNewRound);
        window.onload = () => fetchTracks();
    </script>
</body>
</html>
