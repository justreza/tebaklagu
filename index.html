<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songspot Indonesia - Tebak Lagu Bertahap</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #1db954;
            --accent-red: #e74c3c;
            --accent-yellow: #f1c40f;
            --text-main: #ffffff;
            --text-sub: #b3b3b3;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            width: 100%;
            max-width: 500px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--accent-green);
            letter-spacing: -1px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Modal Config Spotify */
        .api-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
        }

        /* Era Filter Pill Buttons */
        .era-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .era-btn {
            background: #2a2a2a;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .era-btn.active {
            background: var(--accent-green);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-green);
        }

        /* Timeline Durasi (Bintang Utama Heardle/Songspot) */
        .timeline-container {
            display: flex;
            height: 12px;
            background: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
            gap: 2px;
            margin: 10px 0;
        }

        .timeline-segment {
            background: #333;
            height: 100%;
            transition: background 0.3s;
        }

        .timeline-segment.active {
            background: var(--accent-green);
        }

        /* List Percobaan Tebakan (6 Slot) */
        .attempts-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .attempt-slot {
            height: 42px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.02);
            color: var(--text-sub);
        }

        .attempt-slot.wrong {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .attempt-slot.skipped {
            border-color: #555;
            color: var(--text-sub);
        }

        .attempt-slot.correct {
            border-color: var(--accent-green);
            color: var(--accent-green);
            font-weight: bold;
        }

        /* Input Search Autocomplete */
        .search-box {
            position: relative;
        }

        .search-results {
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background: #252525;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            margin-bottom: 5px;
            display: none;
        }

        .search-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            font-size: 0.85rem;
        }

        .search-item:hover {
            background: #333;
            color: var(--accent-green);
        }

        /* Play Button Control */
        .play-control {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }

        .btn-play-big {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-green);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .btn-play-big:active {
            transform: scale(0.95);
        }

        .btn-play-big svg {
            width: 24px;
            height: 24px;
            fill: #000;
            margin-left: 3px;
        }

        /* Action Buttons */
        .action-row {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            flex: 1;
        }

        .btn-skip {
            background: #333;
            color: #fff;
        }

        .btn-submit {
            background: var(--accent-green);
            color: #000;
        }

        /* Hasil Akhir */
        .result-card {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .result-card img {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SONGSPOT INDO</h1>
        <p>Tebak lagu Indonesia dari cuplikan detik terkecil!</p>
    </div>

    <div class="container">

        <!-- Setup API Key -->
        <div id="setup-card" class="api-card">
            <h3 style="margin-bottom: 10px; font-size: 1rem;">Otentikasi Spotify</h3>
            <div class="form-group">
                <label>Client ID Spotify</label>
                <input type="text" id="client-id" placeholder="Tempel Client ID">
            </div>
            <div class="form-group">
                <label>Client Secret Spotify</label>
                <input type="password" id="client-secret" placeholder="Tempel Client Secret">
            </div>
            <button class="btn btn-submit" style="width: 100%;" id="btn-init">Masuk & Mainkan</button>
        </div>

        <!-- Area Game Utama -->
        <div id="game-area" class="hidden">
            
            <!-- Filter Era / Dekade -->
            <div class="era-selector">
                <button class="era-btn active" data-era="all">Semua Era</button>
                <button class="era-btn" data-era="90s">90-an</button>
                <button class="era-btn" data-era="2000s">2000-an</button>
                <button class="era-btn" data-era="2010s">2010-an</button>
                <button class="era-btn" data-era="2020s">2020-an</button>
            </div>

            <!-- Visual Timeline Durasi (0.5s, 1s, 2s, 4s, 7s, 16s) -->
            <div class="timeline-container" id="timeline">
                <!-- Segmen di-render dinamis via JS -->
            </div>

            <!-- List 6 Kali Kesempatan -->
            <div class="attempts-list" id="attempts-list">
                <div class="attempt-slot">1.</div>
                <div class="attempt-slot">2.</div>
                <div class="attempt-slot">3.</div>
                <div class="attempt-slot">4.</div>
                <div class="attempt-slot">5.</div>
                <div class="attempt-slot">6.</div>
            </div>

            <!-- Tombol Putar Musik -->
            <div class="play-control">
                <button class="btn-play-big" id="btn-play">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
            </div>
            <p style="text-align: center; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 15px;" id="duration-info">
                Dengarkan: 0.5 Detik
            </p>

            <!-- Search Autocomplete Input -->
            <div class="search-box">
                <div class="search-results" id="search-results"></div>
                <input type="text" id="guess-input" placeholder="Cari judul lagu atau penyanyi..." style="width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid var(--border-color); border-radius: 6px; color: #fff;" disabled>
            </div>

            <!-- Tombol Aksi -->
            <div class="action-row" style="margin-top: 10px;">
                <button class="btn btn-skip" id="btn-skip" disabled>Lewati (+1s)</button>
                <button class="btn btn-submit" id="btn-submit" disabled>Tebak</button>
            </div>
        </div>

        <!-- Layar Hasil Akhir per Lagu -->
        <div id="result-card" class="result-card hidden">
            <h2 id="result-title" style="margin-bottom: 10px;"></h2>
            <img id="album-cover" src="" alt="Album Cover">
            <h3 id="song-title-res"></h3>
            <p id="artist-res" style="color: var(--text-sub); font-size: 0.9rem; margin-bottom: 15px;"></p>
            
            <button class="btn btn-submit" id="btn-next" style="width: 100%;">Lagu Selanjutnya ➔</button>
        </div>

    </div>

    <!-- Hidden Audio Player -->
    <audio id="audio-player"></audio>

    <script>
        // Durasi cuplikan ala Songspot/Heardle (dalam detik)
        const STEPS = [0.5, 1.0, 2.0, 4.0, 7.0, 16.0];
        
        let spotifyToken = "";
        let trackPool = [];
        let currentTrack = null;
        let currentStep = 0; // 0 sampai 5
        let selectedEra = "all";
        let isGameOver = false;
        let audioTimeout = null;

        // Elemen DOM
        const setupCard = document.getElementById('setup-card');
        const gameArea = document.getElementById('game-area');
        const resultCard = document.getElementById('result-card');
        const btnInit = document.getElementById('btn-init');
        const eraBtns = document.querySelectorAll('.era-btn');
        const timeline = document.getElementById('timeline');
        const attemptsList = document.getElementById('attempts-list');
        const btnPlay = document.getElementById('btn-play');
        const durationInfo = document.getElementById('duration-info');
        const guessInput = document.getElementById('guess-input');
        const searchResults = document.getElementById('search-results');
        const btnSkip = document.getElementById('btn-skip');
        const btnSubmit = document.getElementById('btn-submit');
        const btnNext = document.getElementById('btn-next');
        const audioPlayer = document.getElementById('audio-player');

        // Init Timeline visual
        function renderTimeline() {
            timeline.innerHTML = '';
            const total = STEPS[STEPS.length - 1]; // 16s
            STEPS.forEach((step, idx) => {
                const seg = document.createElement('div');
                seg.className = 'timeline-segment' + (idx <= currentStep ? ' active' : '');
                // Proporsi lebar berdasarkan durasi
                const prev = idx === 0 ? 0 : STEPS[idx - 1];
                const weight = (step - prev) / total * 100;
                seg.style.width = `${weight}%`;
                timeline.appendChild(seg);
            });
        }

        // 1. Otorisasi Spotify
        btnInit.addEventListener('click', async () => {
            const clientId = document.getElementById('client-id').value.trim();
            const clientSecret = document.getElementById('client-secret').value.trim();

            if (!clientId || !clientSecret) {
                alert('Silakan isi Client ID dan Client Secret!');
                return;
            }

            try {
                btnInit.textContent = 'Menghubungkan...';
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Authorization': 'Basic ' + btoa(clientId + ':' + clientSecret)
                    },
                    body: 'grant_type=client_credentials'
                });

                if (!response.ok) throw new Error('Otentikasi gagal! Periksa kredensial Anda.');

                const data = await response.json();
                spotifyToken = data.access_token;

                setupCard.classList.add('hidden');
                gameArea.classList.remove('hidden');

                loadSongsForEra(selectedEra);
            } catch (err) {
                alert(err.message);
                btnInit.textContent = 'Masuk & Mainkan';
            }
        });

        // 2. Query Lagu berdasarkan Era / Dekade
        async function loadSongsForEra(era) {
            guessInput.disabled = true;
            btnSkip.disabled = true;
            btnSubmit.disabled = true;
            durationInfo.textContent = 'Memuat playlist lagu Indonesia...';

            let query = 'genre:indonesian';
            if (era === '90s') query = 'year:1990-1999 indonesia';
            else if (era === '2000s') query = 'year:2000-2009 indonesia';
            else if (era === '2010s') query = 'year:2010-2019 indonesia';
            else if (era === '2020s') query = 'year:2020-2026 indonesia';
            else query = 'pop indonesia';

            try {
                const res = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=50&market=ID`, {
                    headers: { 'Authorization': `Bearer ${spotifyToken}` }
                });
                const data = await res.json();
                
                // Filter lagu yang memiliki Audio Preview
                trackPool = data.tracks.items.filter(t => t.preview_url !== null);

                if (trackPool.length === 0) {
                    alert('Tidak ditemukan lagu dengan audio preview di era ini. Mencoba pencarian umum...');
                    return loadSongsForEra('all');
                }

                startNewRound();
            } catch (e) {
                alert('Gagal mengambil lagu dari Spotify.');
            }
        }

        // Switch Era
        eraBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                eraBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedEra = btn.dataset.era;
                loadSongsForEra(selectedEra);
            });
        });

        // 3. Mulai Ronde Baru
        function startNewRound() {
            isGameOver = false;
            currentStep = 0;
            resultCard.classList.add('hidden');
            gameArea.classList.remove('hidden');

            // Acak lagu dari pool
            currentTrack = trackPool[Math.floor(Math.random() * trackPool.length)];
            audioPlayer.src = currentTrack.preview_url;

            // Reset UI Slot
            const slots = attemptsList.querySelectorAll('.attempt-slot');
            slots.forEach((s, i) => {
                s.className = 'attempt-slot';
                s.textContent = `${i + 1}.`;
            });

            guessInput.value = '';
            guessInput.disabled = false;
            btnSkip.disabled = false;
            btnSubmit.disabled = false;

            updateStepUI();
        }

        // Update Indikator Langkah
        function updateStepUI() {
            renderTimeline();
            const dur = STEPS[currentStep];
            durationInfo.textContent = `Dengarkan: ${dur} Detik`;
            btnSkip.textContent = currentStep === 5 ? 'Menyerah' : `Lewati (+${STEPS[currentStep + 1] - dur}s)`;
        }

        // 4. Mekanisme Pemutaran Audio Presisi (Detik)
        btnPlay.addEventListener('click', () => {
            if (!audioPlayer.src) return;

            if (audioTimeout) clearTimeout(audioTimeout);

            audioPlayer.currentTime = 0;
            audioPlayer.play();

            const playTime = STEPS[currentStep] * 1000;
            audioTimeout = setTimeout(() => {
                audioPlayer.pause();
            }, playTime);
        });

        // 5. Autocomplete Pencarian Judul Lagu
        guessInput.addEventListener('input', () => {
            const val = guessInput.value.toLowerCase().trim();
            if (!val) {
                searchResults.style.display = 'none';
                return;
            }

            // Filter dari pool lagu yang ada
            const matches = trackPool.filter(t => 
                t.name.toLowerCase().includes(val) || 
                t.artists.some(a => a.name.toLowerCase().includes(val))
            ).slice(0, 5);

            if (matches.length > 0) {
                searchResults.innerHTML = '';
                matches.forEach(t => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.textContent = `${t.name} - ${t.artists.map(a => a.name).join(', ')}`;
                    div.addEventListener('click', () => {
                        guessInput.value = div.textContent;
                        searchResults.style.display = 'none';
                    });
                    searchResults.appendChild(div);
                });
                searchResults.style.display = 'block';
            } else {
                searchResults.style.display = 'none';
            }
        });

        // Close dropdown when clicked outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) {
                searchResults.style.display = 'none';
            }
        });

        // 6. Tombol Tebak & Lewati
        btnSubmit.addEventListener('click', () => processGuess(guessInput.value.trim()));
        btnSkip.addEventListener('click', () => processGuess('SKIPPED'));

        function processGuess(guessText) {
            if (isGameOver) return;

            const slots = attemptsList.querySelectorAll('.attempt-slot');
            const currentSlot = slots[currentStep];
            const fullName = `${currentTrack.name} - ${currentTrack.artists.map(a => a.name).join(', ')}`;

            // Jika Benar
            if (guessText.toLowerCase() === fullName.toLowerCase() || 
               (guessText.length > 3 && currentTrack.name.toLowerCase().includes(guessText.toLowerCase()))) {
                
                currentSlot.classList.add('correct');
                currentSlot.textContent = `✓ ${fullName}`;
                endRound(true);
                return;
            }

            // Jika Salah / Lewati
            if (guessText === 'SKIPPED' || guessText === '') {
                currentSlot.classList.add('skipped');
                currentSlot.textContent = `🚫 Dilewati`;
            } else {
                currentSlot.classList.add('wrong');
                currentSlot.textContent = `✗ ${guessText}`;
            }

            // Lanjut ke step berikutnya
            if (currentStep < 5) {
                currentStep++;
                updateStepUI();
                guessInput.value = '';
            } else {
                endRound(false);
            }
        }

        // 7. Akhir Ronde (Menang / Kalah)
        function endRound(isWin) {
            isGameOver = true;
            audioPlayer.pause();

            guessInput.disabled = true;
            btnSkip.disabled = true;
            btnSubmit.disabled = true;

            setTimeout(() => {
                gameArea.classList.add('hidden');
                resultCard.classList.remove('hidden');

                const titleEl = document.getElementById('result-title');
                if (isWin) {
                    titleEl.textContent = "HEBAT! TEBAKANMU BENAR! 🎉";
                    titleEl.style.color = "var(--accent-green)";
                } else {
                    titleEl.textContent = "SAYANG SEKALI, JAWABANNYA: 😅";
                    titleEl.style.color = "var(--accent-red)";
                }

                document.getElementById('album-cover').src = currentTrack.album.images[0]?.url || '';
                document.getElementById('song-title-res').textContent = currentTrack.name;
                document.getElementById('artist-res').textContent = currentTrack.artists.map(a => a.name).join(', ');

                // Putar lagu penuh (30 detik preview) saat layar hasil muncul
                audioPlayer.currentTime = 0;
                audioPlayer.play().catch(() => {});
            }, 1000);
        }

        btnNext.addEventListener('click', startNewRound);
    </script>
</body>
</html>
